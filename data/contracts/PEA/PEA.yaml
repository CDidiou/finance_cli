        exposition: "≈70% USA + Europe + Japon etc."
      - name: "Amundi PEA MSCI World"
        isin: "FR001400U5Q4"
        exposition: "Monde développé"
      - name: "iShares S&P 500 Swap PEA"
        isin: "IE000DQLYVB9"
        exposition: "États-Unis (S&P 500)"
      - name: "Amundi PEA Nasdaq-100"
        isin: "FR0011871110"
        exposition: "Technologie US"
    risque: "Risque de contrepartie sur le swap (limité à 10% par UCITS)"
    avantage: "Meilleure diversification mondiale tout en restant dans le PEA"


  duree_fiscale: "5 ans pour une exonération totale d'IR + PS"
